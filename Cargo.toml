[package]
name = "shared"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"

[dependencies]
bevy = { version = "0.19", default-features = false }
lightyear = { version = "0.28", features = ["replication"] }
serde = { version = "1", features = ["derive"] }
bitcode = "0.6"
# ProtocolHash (replication rule hash) for the connect-time protocol check.
bevy_replicon = { version = "0.41", default-features = false }
# Protocol check rejections; already in the tree via lightyear.
tracing = "0.1"
# Registration builder and registry key types that `lightyear` does not re-export.
lightyear_messages = "0.28"
lightyear_replication = "0.28"

[dev-dependencies]
serde_json = "1"
# Exercise serde-based character creation/roster wire payloads alongside derived encoding.
bitcode = { version = "0.6", features = ["serde"] }
# Same encoder/config lightyear uses for message and component payloads on the wire.
bincode = { version = "2", features = ["serde"] }
# Real Netcode/UDP connect path for the protocol check tests.
lightyear = { version = "0.28", features = ["replication", "netcode", "udp"] }
# Two builds of the same protocol types, differing by one field each.
layout_v1 = { package = "layout-fixture-v1", path = "tests/fixtures/layout-v1" }
layout_v2 = { package = "layout-fixture-v2", path = "tests/fixtures/layout-v2" }

# Per-client server disconnect, used by the protocol check; see vendor/lightyear_netcode/UPSTREAM.md.
# Consumers that run the netcode server (game-server) patch to the same copy.
[patch.crates-io]
lightyear_netcode = { path = "vendor/lightyear_netcode" }
